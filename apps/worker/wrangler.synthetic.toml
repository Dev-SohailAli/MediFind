# Hosted synthetic environment authorized by ADR-276 and
# docs/task-4-synthetic-cloudflare-environment-brief.md. Binds the
# founder-owned, already-provisioned `medifind-synthetic-search` D1 database
# (created 2026-08-17, UUID cb372f8c-ce1d-4443-bc72-dec144bf4dfa) to the
# named synthetic Worker. Read-only invented data only; no Pages hosting,
# custom domain, secret, KV, R2, queue or production capability is added
# here. Deploys are manual (`pnpm --filter @medifind/worker deploy:synthetic`),
# never automatic on push.
name = "medifind-synthetic-worker"
main = "src/index.ts"
compatibility_date = "2026-08-17"
send_metrics = false

[[d1_databases]]
binding = "DB"
database_name = "medifind-synthetic-search"
database_id = "cb372f8c-ce1d-4443-bc72-dec144bf4dfa"
migrations_dir = "./migrations"
