# Hosted synthetic environment, authorized by ADR-276 and
# docs/claude-tasks/task-1-synthetic-cloudflare-environment.md. Binds only
# the approved read-only synthetic D1 database
# (medifind-synthetic-search, created 2026-08-17, UUID
# cb372f8c-ce1d-4443-bc72-dec144bf4dfa) to the named synthetic Worker.
# No account ID, route, secret, KV or R2 is configured. Deploys are a
# manual `wrangler deploy` run, never automatic on push.
name = "medifind-synthetic-worker"
main = "src/index.ts"
compatibility_date = "2026-08-17"
send_metrics = false

[[d1_databases]]
binding = "DB"
database_name = "medifind-synthetic-search"
database_id = "cb372f8c-ce1d-4443-bc72-dec144bf4dfa"
migrations_dir = "./migrations"
